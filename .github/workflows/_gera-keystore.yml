name: _Gera Keystore (one-shot)

on:
  workflow_dispatch: {}

jobs:
  gen:
    runs-on: ubuntu-latest

    # Configure estes três Secrets antes de executar este workflow:
    # KEYSTORE_GENERATION_PASSWORD
    # KEYSTORE_GENERATION_KEY_PASSWORD
    # KEYSTORE_GENERATION_ALIAS
    env:
      STORE_PWD: ${{ secrets.KEYSTORE_GENERATION_PASSWORD }}
      KEY_PWD: ${{ secrets.KEYSTORE_GENERATION_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEYSTORE_GENERATION_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate generation secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$STORE_PWD" || -z "$KEY_PWD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Configure os Secrets KEYSTORE_GENERATION_PASSWORD, KEYSTORE_GENERATION_KEY_PASSWORD e KEYSTORE_GENERATION_ALIAS antes de executar."
            exit 1
          fi

      - name: Generate upload keystore
        env:
          DNAME: "CN=ProDestino, OU=Apps, O=ProDestino, L=Manaus, S=AM, C=BR"
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore upload.keystore \
            -alias "$KEY_ALIAS" \
            -storepass:env STORE_PWD \
            -keypass:env KEY_PWD \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "$DNAME"

          # Gera o arquivo base64 para cadastro manual no Secret do GitHub.
          base64 -w0 upload.keystore > keystore.b64
          echo "Keystore gerado. O conteúdo não será exibido nos logs."

      - name: Upload base64 artifact (sensitive)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64-sensitive
          path: keystore.b64
          retention-days: 1
