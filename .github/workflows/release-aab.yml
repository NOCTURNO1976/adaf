name: Android Release AAB

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    # Credenciais armazenadas nos Secrets do GitHub.
    # Nenhuma senha deve ser impressa nos logs.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Baixa o Gradle 8.9 oficial, gera o wrapper e valida
      - name: Ensure Gradle Wrapper (8.9)
        run: |
          set -e
          GRADLE_VERSION=8.9
          curl -fLsS -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q gradle.zip -d "$HOME/gradle"
          export GRADLE_HOME="$HOME/gradle/gradle-${GRADLE_VERSION}"
          export PATH="$GRADLE_HOME/bin:$PATH"
          gradle --version
          gradle wrapper --gradle-version "${GRADLE_VERSION}"
          chmod +x ./gradlew
          ./gradlew --version

      # Decodifica o keystore, caso as credenciais tenham sido configuradas
      - name: Decode keystore (if provided)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload.keystore
          test -s app/upload.keystore
          echo "Keystore decodificado com sucesso."

      # Cria signing.properties dentro de app/ para o Gradle usar na release
      - name: Create signing.properties (if provided)
        if: ${{ env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'storeFile=upload.keystore\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > app/signing.properties
          echo "Arquivo signing.properties criado (valores ocultos)."

      # Gera o AAB de release (Gradle já assina usando signingConfigs.release)
      - name: Build Release AAB
        run: ./gradlew --no-daemon clean bundleRelease

      # Publica o AAB gerado como artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # (opcional) Se der erro, tenta anexar logs do Gradle
      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            **/build/reports/**/*
            **/build/outputs/**/*
          if-no-files-found: ignore
